name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sanity fires this on publish so blog posts get their share-preview tags baked.
  # See docs/BLOG-SETUP.md for the webhook configuration.
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # ponytail: SPA fallback so /about etc. don't 404 on refresh
      - run: cp dist/index.html dist/404.html
      # 404.html renders fine but still returns HTTP 404, which Google won't
      # index. A real index.html per route makes Pages answer 200.
      # ponytail: keep in sync with public/sitemap.xml and App.tsx routes.
      - run: |
          for p in about services pricing testimonials faq \
                   terms-of-service cookie-policy privacy-policy fulfillment; do
            mkdir -p "dist/$p" && cp dist/index.html "dist/$p/index.html"
          done
      # Bakes og:/twitter: tags into a real page per post, so shared links preview
      # properly and post URLs return 200 instead of falling through to 404.html.
      - run: node scripts/prerender-blog.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
